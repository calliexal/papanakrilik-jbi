  --pasir:#EADCC8;

  --cokelat:#4A3327;
  --tinta:#3B2A20;
  --redup:#6B5040;
  --terang:#FFF8EE;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;

  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--krem);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260' fill='none' stroke='%23B8894D' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round' opacity='.38'><path d='M30 70c10-22 30-30 44-28M38 62c-2-8 2-14 8-16M48 54c0-7 5-12 11-13M58 48c2-6 7-9 12-9'/><path d='M190 40c0 0-8-12-16-6-6 5 2 14 16 12zM190 40c0 0 8-12 16-6 6 5-2 14-16 12zM190 40c0 0-6 10-12 12M190 40c0 0 6 10 12 12M190 34v14'/><path d='M150 170c14 6 22 22 18 40M160 182c8-2 14 2 16 8M164 196c7-1 12 3 13 9M150 170c-4 10-2 20 6 26'/><path d='M60 200l3 7 7 3-7 3-3 7-3-7-7-3 7-3z'/><path d='M215 140l2 5 5 2-5 2-2 5-2-5-5-2 5-2z'/><circle cx='110' cy='110' r='1.6'/><circle cx='230' cy='220' r='1.4'/><circle cx='20' cy='140' r='1.2'/><circle cx='120' cy='20' r='1.2'/><path d='M95 245c6-8 16-10 24-6M100 240c-1-5 2-9 6-10'/></svg>"),radial-gradient(60% 40% at 0% 0%,rgba(232,196,170,.45),transparent 70%),radial-gradient(50% 35% at 100% 30%,rgba(214,182,140,.35),transparent 70%),radial-gradient(60% 40% at 20% 85%,rgba(236,206,186,.4),transparent 70%);background-size:260px 260px,100% 100%,100% 100%,100% 100%;background-attachment:scroll,fixed,fixed,fixed;color:var(--tinta);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--cokelat);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:5;background:rgba(246,239,228,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--garis)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none}
.brand b{font-family:var(--script);font-size:34px;font-weight:400;color:var(--cokelat);line-height:1}
.brand span{font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--redup)}
.nav{display:none;gap:22px;font-size:14px;font-weight:600}
.nav a{text-decoration:none;padding:12px 0}
.nav a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--cokelat);color:var(--terang);font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--cokelat);cursor:pointer;font-family:inherit}
.btn:hover{background:#372519}
.btn.ghost{background:transparent;color:var(--tinta)}
.btn.ghost:hover{background:var(--pasir)}
.btn.light{background:var(--terang);color:var(--tinta);border-color:var(--terang)}
.btn.small{min-height:44px;padding:10px 16px;font-size:14px}

main{padding:28px 0 56px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--redup);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{display:grid;gap:22px;align-items:center}
.hero h1{font-family:var(--script);font-weight:400;font-size:clamp(50px,10vw,78px);line-height:1.05;color:var(--cokelat)}
.hero p{max-width:46ch;color:#5E4636}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:600;background:var(--pasir);color:var(--cokelat);border-radius:999px;padding:8px 14px}

section.block{margin-top:40px}
.block > h2{font-family:var(--script);font-weight:400;font-size:44px;margin-bottom:16px;color:var(--cokelat)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;text-decoration:none;padding:10px 4px 6px;transition:transform .2s ease}
.tile:hover{transform:translateY(-3px)}
.tile .bingkai{display:block;position:relative;width:88%;aspect-ratio:4/5;border-radius:999px 999px 26px 26px;padding:6px;background:linear-gradient(160deg,#FFFAF2,#EAD6BB);box-shadow:0 0 0 1px rgba(184,137,77,.55),0 10px 28px rgba(122,82,52,.18),0 0 34px rgba(232,196,150,.55)}
.tile .bingkai::after{content:'';position:absolute;inset:-7px;border-radius:999px 999px 32px 32px;border:1px dashed rgba(184,137,77,.45);pointer-events:none}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:999px 999px 20px 20px}
.tile:hover .bingkai{box-shadow:0 0 0 1px rgba(184,137,77,.8),0 14px 34px rgba(122,82,52,.24),0 0 44px rgba(232,196,150,.8)}
.tile .teks{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;max-width:100%}
.tile b{font-family:var(--script);font-size:clamp(26px,7.6vw,36px);font-weight:400;line-height:1.05;color:var(--cokelat);overflow-wrap:anywhere}
.tile span{font-size:13px;line-height:1.45;color:var(--redup)}

.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:14px 18px;background:var(--pasir);border-radius:16px;text-decoration:none;font-size:16px;font-weight:600}
.row:hover{background:#E2D1B9}
.cta{background:var(--cokelat);color:var(--terang);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.cta h2{font-family:var(--script);font-weight:400;font-size:44px;color:var(--terang)}
.cta p{color:var(--pasir);max-width:52ch}

.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.pagehead{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.pagehead h1{font-family:var(--script);font-weight:400;font-size:clamp(48px,9vw,66px);line-height:1.05;color:var(--cokelat)}
.pagehead p{color:#5E4636;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:999px;background:var(--pasir);font-weight:700;font-size:14px;text-decoration:none}
.chip:hover{background:#E2D1B9}
.chip[aria-current="true"]{background:var(--cokelat);color:var(--terang)}
.group{margin-top:28px}
.group > h2{font-family:var(--script);font-weight:400;font-size:40px;color:var(--cokelat);margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.group > h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--redup)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--kertas);border:1px solid var(--garis);border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .15s ease}
.card:hover{transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover}
.card div{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card b{font-size:15px;font-weight:600;line-height:1.3}
.card span{font-size:13px;color:var(--redup)}
.card strong{font-size:16px;color:var(--cokelat);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.empty{padding:28px;background:var(--kertas);border:1px dashed var(--garis);border-radius:18px;color:var(--redup)}

.detail{display:grid;gap:24px}
.detail .photo{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:22px}
.detail h1{font-size:clamp(34px,6vw,46px)}
.price{font-size:28px;font-weight:700;color:var(--cokelat);font-variant-numeric:tabular-nums}
.spec{background:var(--kertas);border:1px solid var(--garis);border-radius:18px;padding:4px 16px}
.spec div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--pasir);font-size:14px}
.spec div:last-child{border-bottom:0}
.spec dt{color:#5E4636}
.spec dd{margin:0;font-weight:600;text-align:right}
.addon{display:flex;gap:14px;align-items:center;background:var(--pasir);border-radius:18px;padding:14px}
.addon img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.addon b{display:block;font-size:14px}
.addon span{font-size:13px;color:var(--cokelat)}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .btn{width:100%}

.gallery{columns:2;column-gap:12px}
.gallery img{width:100%;border-radius:14px;margin-bottom:12px;break-inside:avoid}
.reviews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review{background:var(--kertas);border:1px solid var(--garis);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.review img{width:100%;aspect-ratio:4/5;object-fit:cover}
.review div{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.review b{font-size:14px}
.review p{font-size:14px;overflow-wrap:anywhere}
.review span{font-size:12px;color:var(--redup)}
.form{background:var(--kertas);border:1px solid var(--garis);border-radius:22px;padding:20px;display:grid;gap:14px;max-width:560px}
.form h2{font-family:var(--script);font-weight:400;font-size:40px;color:var(--cokelat)}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field small{font-size:12px;color:var(--redup)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid #C9B49A;border-radius:12px;background:#fff;color:var(--tinta);font:inherit}
.field textarea{min-height:110px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.msg{font-size:14px;font-weight:600;border-radius:12px;padding:12px 14px;background:var(--pasir)}
.msg[hidden]{display:none}
.msg.err{background:#F6D9D4;color:#7A1F14}
.msg.ok{background:#DCEBD9;color:#1F5130}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:14px;background:var(--kertas);border:1px solid var(--garis);border-radius:18px;padding:16px}
.steps li::before{content:counter(s);flex:none;width:36px;height:36px;border-radius:18px;background:var(--cokelat);color:var(--terang);font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{display:block}
.list{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.list li{background:var(--kertas);border:1px solid var(--garis);border-radius:16px;padding:14px 16px}
.note{font-size:13px;color:var(--redup);background:var(--pasir);border-radius:12px;padding:10px 14px;margin-top:14px}

footer{border-top:1px solid var(--garis);padding:24px 0 96px;font-size:13px;color:#5E4636}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer b{color:var(--tinta)}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;box-shadow:0 8px 24px rgba(59,42,32,.28)}

/* Kelip-kelip: bintang 4 sudut yang berdenyut */
.sparkly{position:relative;isolation:isolate}
.tw{position:absolute;z-index:2;width:var(--s,14px);height:var(--s,14px);color:var(--c,var(--emas));pointer-events:none;
  background:currentColor;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  filter:drop-shadow(0 0 6px rgba(255,240,210,.95));opacity:.2;transform:scale(.4);
  animation:kelip var(--t,2.6s) ease-in-out var(--d,0s) infinite}
.tw.putih{--c:#FFFDF8}
@keyframes kelip{0%,100%{opacity:.15;transform:scale(.35) rotate(0deg)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9;transform:scale(.85) rotate(60deg)}}
.glow{position:absolute;inset:auto;z-index:-1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(201,160,100,.28),transparent 70%);animation:napas 4s ease-in-out infinite}
@keyframes napas{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
.tile{position:relative}
.tile .teks{position:relative}
@media (min-width:700px){
  .nav{display:flex}
  .hero{grid-template-columns:1fr 1fr;gap:36px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .rows{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .detail{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
  .gallery{columns:3}
  .reviews{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .actions{flex-direction:row}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .gallery{columns:4}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .tile,.card{transition:none}
  .tw,.glow{animation:none;opacity:.7;transform:none}
}
</style>

// ---------- FOTO CUSTOMER (Supabase) ----------
var sb = null;
function db(){
  if (sb) return sb;
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) return null;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return sb;
}
// Semua teks dari customer WAJIB lewat esc() sebelum masuk innerHTML (cegah XSS).
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function produkNama(id){ for (var i=0;i<PRODUK.length;i++) if (PRODUK[i].id===id) return PRODUK[i].nama; return ''; }
function contohGaleri(catatan){
  return '<div class="gallery">' + GALERI.map(function(g){ return '<img loading="lazy" src="' + img(g) + '" alt="Papan ucapan terpasang di lokasi acara">'; }).join('') + '</div>' +
    '<p class="note">' + catatan + '</p>';
}
function muatUlasan(){
  var box = document.getElementById('ulasan');
  if (!box) return;
  var c = db();
  if (!c) { box.innerHTML = contohGaleri('Supabase belum dihubungkan, jadi yang tampil masih foto dari katalog.'); return; }
  c.from('customer_photos').select('id,name,comment,product_id,image_path,created_at')
    .eq('status','approved').order('created_at',{ascending:false}).limit(60)
    .then(function(res){
      if (!document.getElementById('ulasan')) return;
      if (res.error) { box.innerHTML = contohGaleri('Foto customer gagal dimuat. Coba muat ulang halaman.'); return; }
      if (!res.data.length) { box.innerHTML = contohGaleri('Belum ada foto dari customer. Jadi yang pertama kirim, dear.'); return; }
      box.innerHTML = '<div class="reviews">' + res.data.map(function(u){
        var url = c.storage.from(BUCKET).getPublicUrl(u.image_path).data.publicUrl;
        var tgl = new Date(u.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
        var pn = u.product_id ? produkNama(u.product_id) : '';
        return '<article class="review"><img loading="lazy" src="' + esc(url) + '" alt="Foto dari ' + esc(u.name) + '">' +
          '<div><b>' + esc(u.name) + '</b><p>' + esc(u.comment) + '</p><span>' + (pn ? esc(pn) + ' · ' : '') + esc(tgl) + '</span></div></article>';
      }).join('') + '</div>';
    });
}
// Kecilkan foto di browser: sisi terpanjang 1280px, JPEG. Hemat kuota customer dan storage.
function kecilkan(file){
  return new Promise(function(ok, gagal){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var k = Math.min(1, 1280 / Math.max(im.width, im.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? ok(b) : gagal(new Error('Foto tidak bisa diproses.')); }, 'image/jpeg', 0.82);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); gagal(new Error('Berkas ini bukan foto yang bisa dibaca.')); };
    im.src = url;
  });
}
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0,8) + '-' + h.slice(8,12) + '-' + h.slice(12,16) + '-' + h.slice(16,20) + '-' + h.slice(20);
}
function pesan(teks, jenis){
  var m = document.getElementById('f-msg');
  m.textContent = teks; m.className = 'msg' + (jenis ? ' ' + jenis : ''); m.hidden = false;
}
function kirimFoto(e){
  e.preventDefault();
  var f = e.target, tombol = document.getElementById('f-kirim');
  var nama = f.nama.value.trim(), komen = f.komen.value.trim(), file = f.foto.files[0];
  if (f.web.value) return; // honeypot: bot mengisi kolom tersembunyi
  if (!nama) return pesan('Isi nama kamu dulu.', 'err');
  if (!komen) return pesan('Tulis komentar kamu dulu.', 'err');
  if (!file) return pesan('Pilih satu foto dulu.', 'err');
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return pesan('Foto harus JPG, PNG, atau WebP.', 'err');
  if (file.size > 15 * 1024 * 1024) return pesan('Foto terlalu besar. Maksimal 15 MB.', 'err');
  var c = db();
  if (!c) return pesan('Form belum terhubung ke Supabase, jadi foto belum terkirim.', 'err');
  tombol.disabled = true; pesan('Mengirim foto…');
  var path = uuid() + '.jpg';
  kecilkan(file).then(function(blob){
    return c.storage.from(BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  }).then(function(up){
    if (up.error) throw up.error;
    // Tanpa .select(): baris berstatus pending tidak boleh dibaca publik.
    return c.from('customer_photos').insert({name:nama, comment:komen, product_id:f.produk.value || null, image_path:path});
  }).then(function(ins){
    if (ins.error) throw ins.error;
    f.reset(); pesan('Terima kasih! Foto kamu tampil setelah dicek admin.', 'ok');
  }).catch(function(){
    pesan('Foto gagal dikirim. Cek koneksi kamu, lalu coba lagi.', 'err');
  }).then(function(){ tombol.disabled = false; });
}
function initGaleri(){
  muatUlasan();
  document.getElementById('f-foto').addEventListener('submit', kirimFoto);
  document.getElementById('ke-form').addEventListener('click', function(){
    document.getElementById('form-foto').scrollIntoView({behavior:'smooth'});
    document.getElementById('f-nama').focus({preventScroll:true});

}

// ---------- ROUTER (hanya #nama sederhana) ----------
function render(){
  var r = (location.hash || '').replace(/^#/, '');
  var html, judul = 'Papan Akrilik Jambi';
  if (r.indexOf('p-') === 0) html = halProduk(r.slice(2));
  else if (r === 'harga' || r.indexOf('harga-') === 0) html = halHarga(r.slice(6));
  else if (r === 'jenis' || r.indexOf('jenis-') === 0) html = halJenis(r.slice(6));
  else if (r === 'warna' || r.indexOf('warna-') === 0) html = halWarna(r.slice(6));
  else if (r === 'galeri') html = halGaleri();
  else if (r === 'cara-pesan') html = halCara();
  else if (r === 'rules') html = halRules();
  else html = beranda();
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
  if (r === 'galeri') initGaleri();
}
window.addEventListener('hashchange', render);
render();
